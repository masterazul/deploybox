[package]
name = "deploybox"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "One-command preview deployments: build a repo into a container and serve it"
license = "MIT"
repository = "https://github.com/masterazul/deploybox"
readme = "README.md"
keywords = ["docker", "preview", "deploy", "proxy", "devops"]
categories = ["command-line-utilities"]

[[bin]]
name = "deploybox"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
